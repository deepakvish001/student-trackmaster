    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <body>
    <div id="root"></div>
    
    <!-- Load jQuery and MFS100 SDK asynchronously after critical content -->
    <script>
      // Load jQuery asynchronously
      function loadScript(src, callback) {
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        if (callback) script.onload = callback;
        document.head.appendChild(script);
      }
      
      // Load jQuery first, then MFS100 SDK
      loadScript('https://code.jquery.com/jquery-3.6.0.min.js', function() {
        // jQuery loaded, now load MFS100 SDK
        loadScript('/mfs100-9.0.2.6.js');
      });
    </script>
